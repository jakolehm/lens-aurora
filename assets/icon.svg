<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14202a"/>
      <stop offset="1" stop-color="#17161d"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#4ecb71"/>
      <stop offset="0.5" stop-color="#2fbf9a"/>
      <stop offset="1" stop-color="#5b83ff"/>
    </linearGradient>
    <filter id="wide" x="-50%" y="-50%" width="200%" height="200%">
